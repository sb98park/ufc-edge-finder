<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline &middot; Octane Alpha</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #000; color: #e9e9ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center; line-height: 1.6;
  }
  .wrap { max-width: 320px; }
  svg { display: block; margin: 0 auto 22px; }
  h1 { font-size: 19px; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; font-size: 13.5px; color: #9a9aa4; }
  button {
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    background: #d4af37; color: #151208; border: 0;
    border-radius: 10px; padding: 12px 26px;
  }
  .note { margin-top: 20px; font-size: 11px; color: #6f6f79; }
</style>
</head>
<body>
  <div class="wrap">
    <svg width="56" height="56" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M8.35 45.94 L8.35 26.35 L22.20 12.50 L41.80 12.50 L55.65 26.35 L55.65 45.94"
            stroke="#ffffff" stroke-width="3.58" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
      <path d="M20.48 51.51 L32.00 28.47 L43.52 51.51"
            stroke="#d4af37" stroke-width="3.58" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>No connection</h1>
    <p>Octane Alpha needs the network. Odds and model output move constantly, so there is no useful offline copy to show you &mdash; a cached card would be quietly wrong rather than merely absent.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="note">This page is the only thing stored on your device.</div>
  </div>
</body>
</html>
