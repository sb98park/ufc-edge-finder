name: Refresh UFC Edge Finder

on:
  schedule:
    # KEPT AS A BACKSTOP ONLY -- this is no longer the primary trigger.
    # Measured 2026-08-12..14, GitHub delivered this */5 schedule about
    # ONCE AN HOUR (gaps of 43-137 min), roughly one tick in twelve.
    # `schedule` is documented as best-effort and drops ticks under load,
    # so that is GitHub working as designed, not a misconfiguration here.
    # It stays because a tick an hour is a useful floor if the Cloudflare
    # Worker below is ever down, misconfigured, or its PAT expires.
    # Note the front-end already updates displayed prices in real time
    # client-side (data-live-token); this job's cadence governs model
    # recalcs, result detection, movement tags, and charts.
    - cron: "*/5 * * * *"

  # THE ACTUAL 5-MINUTE CADENCE. Fired by cloudflare-worker/refresh-tick.js
  # on a Cloudflare Cron Trigger, because Cloudflare delivers the ticks
  # GitHub drops. The Worker holds NO cadence logic -- it fires every 5
  # minutes unconditionally and scripts/should_refresh.py remains the sole
  # decision-maker about whether any given tick becomes a build.
  #
  # THROTTLED, exactly like `schedule` -- see the cadence step below. This
  # is why the Worker fires repository_dispatch and not workflow_dispatch:
  # workflow_dispatch bypasses the gate by design, so pointing the Worker at
  # it would produce 288 unthrottled builds a day and walk straight back
  # into the Pages deployment saturation the gate exists to prevent.
  repository_dispatch:
    types: [tick]

  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

# At 5-minute spacing, schedule jitter can bunch two runs together --
# without this, both would generate, both would commit, and one push
# would be rejected (exactly the fetch-first race a manual push hits
# when the remote moves underneath it). Serialize: one run at a time,
# at most one queued behind it; further triggers collapse into the
# queued one, which is the correct behavior for a refresh job (running
# three stale queued refreshes back-to-back would add nothing).
concurrency:
  group: refresh
  # Kept false ON PURPOSE: this job commits and pushes, and cancelling one
  # mid-push risks leaving the repo in a half-written state. The cost of that
  # choice is that a hung run BLOCKS every later run -- which is exactly what
  # timeout-minutes below exists to bound.
  cancel-in-progress: false

permissions:
  contents: write
  # Artifact-based Pages deployment needs these two. The branch-source
  # deployment this replaces required neither -- it cloned the repo instead,
  # which is exactly the problem: 288 commits a day each rewriting a 4.2MB
  # index.html had grown the pack to 157MB, and the Pages builder timed out
  # cloning it. Uploading only the 4.2MB of output makes deployment time
  # independent of history size.
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # WITHOUT THIS, GITHUB'S DEFAULT IS SIX HOURS. With cancel-in-progress
    # false, one hung run holds the concurrency group for that entire time and
    # every scheduled run behind it is dropped (GitHub queues only one). That
    # produced a 12-hour gap with no site update two days before a card, and
    # nothing looked broken -- the workflow was simply "in progress".
    # 12 minutes is generous for a heavy build (six events, 67 fights) and
    # still bounds a hang to two missed cycles instead of seventy.
    timeout-minutes: 12
    outputs:
      build: ${{ steps.cadence.outputs.build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Shallow. The job needs the current files, not 157MB of history --
          # and a full clone of a repo that gains ~100MB a month was adding
          # minutes to every one of the 288 daily runs.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # THE GATE RUNS BEFORE THE INSTALL, ON PURPOSE. Most ticks skip -- with
      # Cloudflare firing every 5 minutes that's ~264 of ~288 runs a day on a
      # quiet week -- and there is no reason for a run that has already
      # decided to do nothing to spend ~90s installing pandas first.
      # scripts/should_refresh.py is deliberately stdlib-only so it can sit
      # here, above the install; adding a third-party import to it would
      # force this step back below and quietly restore that cost.
      - name: Decide whether this run needs to build
        id: cadence
        # AUTOMATED ticks are throttled; HUMAN triggers always build.
        #
        # The two automated triggers -- GitHub's own `schedule` and the
        # `tick` repository_dispatch from cloudflare-worker/refresh-tick.js
        # -- both go through scripts/should_refresh.py, which is the single
        # source of truth for cadence. Neither trigger carries any opinion
        # about whether a build is warranted; that decision lives in Python
        # and nowhere else.
        #
        # workflow_dispatch and push are the deliberate escape hatches and
        # bypass the gate entirely: the "Run workflow" button (and the phone
        # Shortcut that hits the same endpoint) must stay a GUARANTEED
        # immediate refresh, which is exactly what makes it the right tool
        # on fight night.
        #
        # Skipping sets an output the later steps check, rather than failing
        # the job -- a red X every few minutes would train everyone to ignore
        # the Actions tab, which is where today's real failures were hiding.
        env:
          # Via env rather than inlined into the script. github.event_name is
          # a trusted fixed enum so this isn't an injection fix, just the
          # form that stays safe if the condition ever widens to a field an
          # outside caller controls (client_payload, a branch name).
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            schedule|repository_dispatch)
              if python scripts/should_refresh.py; then
                echo "build=yes" >> $GITHUB_OUTPUT
              else
                echo "build=no" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "reason=manual or push -- always builds" >> $GITHUB_OUTPUT
              echo "build=yes" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install dependencies
        # Gated: a skipped run never installs anything. Every step from here
        # down is build-only, so a skip now costs a checkout, a Python setup
        # and a few seconds of stdlib date arithmetic.
        if: steps.cadence.outputs.build == 'yes'
        run: pip install -r requirements.txt

      - name: Merge recorded results into fight history
        if: steps.cadence.outputs.build == 'yes' 
        # Runs BEFORE generate_site so the ratings, streak bonus, recency
        # weighting and fun facts all see the fights immediately.
        #
        # This gap was invisible until a fighter's streak read 4 against a
        # real 5: the site had been recording results to fight_results.csv
        # and never carrying them into fight_history.csv, so it watched 52
        # fights and then predicted the next card as though none had
        # happened. Manual scripts get forgotten -- a 41-fight backlog is
        # what forgetting looks like.
        #
        # No network: reads a file the previous run already wrote.
        run: python scripts/merge_results_into_history.py --apply || true

      - name: Backfill history gaps from ESPN
        timeout-minutes: 4
        if: steps.cadence.outputs.build == 'yes'
        # Catches fights that happened between the raw dataset's cutoff and
        # the site's own tracking window -- the range neither other source
        # covers.
        #
        # NON-BLOCKING deliberately. ESPN returns 403 after a burst of calls,
        # and a throttled backfill must not stop the site publishing odds and
        # results. It retries with backoff and reports the block clearly.
        run: python scripts/backfill_history_from_espn.py --apply || true

      - name: Generate site
        timeout-minutes: 6
        if: steps.cadence.outputs.build == 'yes'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Both optional -- unset until the Cloudflare Worker relay
          # (cloudflare-worker/combat-edge-relay.js) is deployed and these
          # two repo secrets are added. Until then, Combat Edge requests
          # behave exactly as before (direct, unrelayed).
          COMBAT_EDGE_RELAY_URL: ${{ secrets.COMBAT_EDGE_RELAY_URL }}
          COMBAT_EDGE_RELAY_TOKEN: ${{ secrets.COMBAT_EDGE_RELAY_TOKEN }}
        run: python generate_site.py

      - name: Lint rendered output
        if: steps.cadence.outputs.build == 'yes'
        # Gates the COMMIT, not the generation -- a page that fails these
        # checks never reaches the repo, so a stray brace or an undeferred
        # init can't ship the way both previously did.
        #
        # DELIBERATELY NON-BLOCKING (|| true). This job also carries live
        # fight-night results, and a linter false positive during a card
        # would freeze the site exactly when it matters most. Failures are
        # printed loudly in the log; flip to a hard failure once the checks
        # have run clean across a few weeks of real builds.
        run: python scripts/lint_site.py || true

      - name: Upload the built site
        if: steps.cadence.outputs.build == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit and push if changed
        if: steps.cadence.outputs.build == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .gitattributes points docs/* and data/* at a custom "ours"
          # merge driver, but git doesn't ship one under that name --
          # it has to be registered locally before git will honor it.
          # Each Actions run gets a fresh, empty checkout with no config
          # carried over from previous runs, so without this line every
          # run silently falls back to a real content-level merge on
          # these files and fails with a genuine conflict the moment
          # the remote has moved (a manual push, or a prior queued run).
          git config merge.ours.driver true
          # Directory-scoped, not an explicit file list -- an explicit
          # list silently misses any new output file a future change
          # adds (this is exactly what broke: data/future_cards.csv and
          # data/fighters.csv were both being written by the pipeline
          # but weren't in the old list, which left them uncommitted and
          # made every subsequent `git pull --rebase` below fail against
          # a dirty working tree, halting the job before it ever reached
          # `git push`). Scoped to docs/ and data/ specifically rather
          # than `git add -A` at the repo root, so it can never
          # accidentally stage something outside the pipeline's own
          # output (source changes, workflow edits, etc.).
          # data/ ONLY. docs/ is the BUILT SITE and is no longer committed:
          # Pages deploys it from the uploaded artifact, so committing it
          # bought nothing but ~100MB of repo growth a month (a 4MB
          # index.html rewritten on every run, which barely compresses
          # against the previous version) and a merge conflict on every
          # pull. The pack had reached 157MB and the Pages builder was
          # timing out cloning it.
          #
          # data/ still IS committed -- it's genuine state the next run
          # needs: recorded results, the odds snapshot, the token cache,
          # the predictions log.
          # data/ plus docs/ -- .gitignore decides what within docs/ is
          # eligible, so the per-build index.html and movements/ are excluded
          # while the brand assets (which change perhaps twice a year) are
          # kept. Staging docs/ wholesale here would have been wrong before
          # that ignore existed; with it, this is the safe form.
          git add -A -- data/ docs/
          git diff --staged --quiet || git commit -m "Auto-refresh site [skip ci]"
          # Rebase onto whatever landed on the remote while this run was
          # working (a manual push, or a run that slipped past the
          # concurrency queue) instead of failing on a non-fast-forward.
          git pull --rebase origin main
          git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.build == 'yes' 
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 minutes, up from the 10-minute default.
          #
          # Every failure so far has been the ACTION giving up while GitHub
          # still reported deployment_in_progress -- not an error from Pages,
          # and not a queue: the environment shows no deployment stuck ahead
          # of these. Cancelling at 10 minutes may itself be what stops them
          # finishing.
          #
          # If it still fails at 30, the problem is on GitHub's side and worth
          # raising with support rather than tuning further.
          timeout: 1800000
          error_count: 20
