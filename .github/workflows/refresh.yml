name: Refresh UFC Edge Finder

on:
  schedule:
    # Every 5 minutes -- GitHub Actions' minimum cron interval. Honest
    # expectation-setting: scheduled triggers are best-effort and lag
    # 5-20 min under load (especially at the top of the hour), so this
    # buys a faster AVERAGE cadence, not a guaranteed 5-minute tick.
    # The manual "Run workflow" button (workflow_dispatch) remains the
    # guaranteed on-demand refresh, including from the GitHub mobile app.
    # Note the front-end already updates displayed prices in real time
    # client-side (data-live-token); this job's cadence governs model
    # recalcs, result detection, movement tags, and charts.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

# At 5-minute spacing, schedule jitter can bunch two runs together --
# without this, both would generate, both would commit, and one push
# would be rejected (exactly the fetch-first race a manual push hits
# when the remote moves underneath it). Serialize: one run at a time,
# at most one queued behind it; further triggers collapse into the
# queued one, which is the correct behavior for a refresh job (running
# three stale queued refreshes back-to-back would add nothing).
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  # Artifact-based Pages deployment needs these two. The branch-source
  # deployment this replaces required neither -- it cloned the repo instead,
  # which is exactly the problem: 288 commits a day each rewriting a 4.2MB
  # index.html had grown the pack to 157MB, and the Pages builder timed out
  # cloning it. Uploading only the 4.2MB of output makes deployment time
  # independent of history size.
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Shallow. The job needs the current files, not 157MB of history --
          # and a full clone of a repo that gains ~100MB a month was adding
          # minutes to every one of the 288 daily runs.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge recorded results into fight history
        # Runs BEFORE generate_site so the ratings, streak bonus, recency
        # weighting and fun facts all see the fights immediately.
        #
        # This gap was invisible until a fighter's streak read 4 against a
        # real 5: the site had been recording results to fight_results.csv
        # and never carrying them into fight_history.csv, so it watched 52
        # fights and then predicted the next card as though none had
        # happened. Manual scripts get forgotten -- a 41-fight backlog is
        # what forgetting looks like.
        #
        # No network: reads a file the previous run already wrote.
        run: python scripts/merge_results_into_history.py --apply || true

      - name: Backfill history gaps from ESPN
        # Catches fights that happened between the raw dataset's cutoff and
        # the site's own tracking window -- the range neither other source
        # covers.
        #
        # NON-BLOCKING deliberately. ESPN returns 403 after a burst of calls,
        # and a throttled backfill must not stop the site publishing odds and
        # results. It retries with backoff and reports the block clearly.
        run: python scripts/backfill_history_from_espn.py --apply || true

      - name: Generate site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Both optional -- unset until the Cloudflare Worker relay
          # (cloudflare-worker/combat-edge-relay.js) is deployed and these
          # two repo secrets are added. Until then, Combat Edge requests
          # behave exactly as before (direct, unrelayed).
          COMBAT_EDGE_RELAY_URL: ${{ secrets.COMBAT_EDGE_RELAY_URL }}
          COMBAT_EDGE_RELAY_TOKEN: ${{ secrets.COMBAT_EDGE_RELAY_TOKEN }}
        run: python generate_site.py

      - name: Lint rendered output
        # Gates the COMMIT, not the generation -- a page that fails these
        # checks never reaches the repo, so a stray brace or an undeferred
        # init can't ship the way both previously did.
        #
        # DELIBERATELY NON-BLOCKING (|| true). This job also carries live
        # fight-night results, and a linter false positive during a card
        # would freeze the site exactly when it matters most. Failures are
        # printed loudly in the log; flip to a hard failure once the checks
        # have run clean across a few weeks of real builds.
        run: python scripts/lint_site.py || true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .gitattributes points docs/* and data/* at a custom "ours"
          # merge driver, but git doesn't ship one under that name --
          # it has to be registered locally before git will honor it.
          # Each Actions run gets a fresh, empty checkout with no config
          # carried over from previous runs, so without this line every
          # run silently falls back to a real content-level merge on
          # these files and fails with a genuine conflict the moment
          # the remote has moved (a manual push, or a prior queued run).
          git config merge.ours.driver true
          # Directory-scoped, not an explicit file list -- an explicit
          # list silently misses any new output file a future change
          # adds (this is exactly what broke: data/future_cards.csv and
          # data/fighters.csv were both being written by the pipeline
          # but weren't in the old list, which left them uncommitted and
          # made every subsequent `git pull --rebase` below fail against
          # a dirty working tree, halting the job before it ever reached
          # `git push`). Scoped to docs/ and data/ specifically rather
          # than `git add -A` at the repo root, so it can never
          # accidentally stage something outside the pipeline's own
          # output (source changes, workflow edits, etc.).
          git add -A -- docs/ data/
          git diff --staged --quiet || git commit -m "Auto-refresh site [skip ci]"
          # Rebase onto whatever landed on the remote while this run was
          # working (a manual push, or a run that slipped past the
          # concurrency queue) instead of failing on a non-fast-forward.
          git pull --rebase origin main
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 30 minutes, up from the 10-minute default.
          #
          # Every failure so far has been the ACTION giving up while GitHub
          # still reported deployment_in_progress -- not an error from Pages,
          # and not a queue: the environment shows no deployment stuck ahead
          # of these. Cancelling at 10 minutes may itself be what stops them
          # finishing.
          #
          # If it still fails at 30, the problem is on GitHub's side and worth
          # raising with support rather than tuning further.
          timeout: 1800000
          error_count: 20
