name: Refresh UFC Edge Finder

on:
  schedule:
    # KEPT AS A BACKSTOP ONLY -- this is no longer the primary trigger.
    # Measured 2026-08-12..14, GitHub delivered this */5 schedule about
    # ONCE AN HOUR (gaps of 43-137 min), roughly one tick in twelve.
    # `schedule` is documented as best-effort and drops ticks under load,
    # so that is GitHub working as designed, not a misconfiguration here.
    # It stays because a tick an hour is a useful floor if the Cloudflare
    # Worker below is ever down, misconfigured, or its PAT expires.
    # Note the front-end already updates displayed prices in real time
    # client-side (data-live-token); this job's cadence governs model
    # recalcs, result detection, movement tags, and charts.
    - cron: "*/5 * * * *"

  # THE ACTUAL 5-MINUTE CADENCE. Fired by cloudflare-worker/refresh-tick.js
  # on a Cloudflare Cron Trigger, because Cloudflare delivers the ticks
  # GitHub drops. The Worker holds NO cadence logic -- it fires every 5
  # minutes unconditionally and scripts/should_refresh.py remains the sole
  # decision-maker about whether any given tick becomes a build.
  #
  # THROTTLED, exactly like `schedule` -- see the cadence step below. This
  # is why the Worker fires repository_dispatch and not workflow_dispatch:
  # workflow_dispatch bypasses the gate by design, so pointing the Worker at
  # it would produce 288 unthrottled builds a day and walk straight back
  # into the Pages deployment saturation the gate exists to prevent.
  repository_dispatch:
    types: [tick]

  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

# At 5-minute spacing, schedule jitter can bunch two runs together --
# without this, both would generate, both would commit, and one push
# would be rejected (exactly the fetch-first race a manual push hits
# when the remote moves underneath it). Serialize: one run at a time,
# at most one queued behind it; further triggers collapse into the
# queued one, which is the correct behavior for a refresh job (running
# three stale queued refreshes back-to-back would add nothing).
concurrency:
  group: refresh
  # Kept false ON PURPOSE: this job commits and pushes, and cancelling one
  # mid-push risks leaving the repo in a half-written state. The cost of that
  # choice is that a hung run BLOCKS every later run -- which is exactly what
  # timeout-minutes below exists to bound.
  cancel-in-progress: false

permissions:
  contents: write
  # Artifact-based Pages deployment needs these two. The branch-source
  # deployment this replaces required neither -- it cloned the repo instead,
  # which is exactly the problem: 288 commits a day each rewriting a 4.2MB
  # index.html had grown the pack to 157MB, and the Pages builder timed out
  # cloning it. Uploading only the 4.2MB of output makes deployment time
  # independent of history size.
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # WITHOUT THIS, GITHUB'S DEFAULT IS SIX HOURS. With cancel-in-progress
    # false, one hung run holds the concurrency group for that entire time and
    # every scheduled run behind it is dropped (GitHub queues only one). That
    # produced a 12-hour gap with no site update two days before a card, and
    # nothing looked broken -- the workflow was simply "in progress".
    # THE INVARIANT: this cap must stay GREATER THAN the sum of the step caps
    # below plus fixed overhead, and it was not. 12 sat under 4 + 4 + 10 = 18
    # before checkout, setup and the ~90s pip install were counted at all, so
    # the step budgets were not budgets -- on any run where both ESPN
    # backfills went the distance, `Generate site` inherited ~2 of the 10
    # minutes it is explicitly configured for and the RUNNER KILLED THE JOB.
    # That is strictly worse than the step death continue-on-error was added
    # to fix: no artifact upload, no commit, `deploy` skipped on its needs,
    # and the build produces nothing at all rather than something imperfect.
    #
    # Fixed both ways so the arithmetic is true rather than merely closer:
    # the backfills came down to 2 each (they are additive gap-fillers, see
    # their own comments) and this came up to 18. Worst case is now 2 + 2 + 10
    # = 14 capped, plus ~2.5 for checkout/setup/install and ~1 for the
    # uncapped steps -- about 17.5, inside 18 with the margin on this side of
    # the cap where it belongs.
    #
    # The cost is that a genuine hang now blocks the concurrency group for 18
    # minutes rather than 12, about one extra missed cycle. That is the right
    # trade: a hang is rare and the bound is still nowhere near GitHub's
    # six-hour default, whereas the budget overrun above was reachable by an
    # ordinary slow ESPN week.
    #
    # ANY future step that gains a timeout-minutes must be added to that sum.
    timeout-minutes: 18
    outputs:
      build: ${{ steps.cadence.outputs.build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Shallow. The job needs the current files, not 157MB of history --
          # and a full clone of a repo that gains ~100MB a month was adding
          # minutes to every one of the 288 daily runs.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # THE GATE RUNS BEFORE THE INSTALL, ON PURPOSE. Most ticks skip -- with
      # Cloudflare firing every 5 minutes that's ~264 of ~288 runs a day on a
      # quiet week -- and there is no reason for a run that has already
      # decided to do nothing to spend ~90s installing pandas first.
      # scripts/should_refresh.py is deliberately stdlib-only so it can sit
      # here, above the install; adding a third-party import to it would
      # force this step back below and quietly restore that cost.
      - name: Decide whether this run needs to build
        id: cadence
        # AUTOMATED ticks are throttled; HUMAN triggers always build.
        #
        # The two automated triggers -- GitHub's own `schedule` and the
        # `tick` repository_dispatch from cloudflare-worker/refresh-tick.js
        # -- both go through scripts/should_refresh.py, which is the single
        # source of truth for cadence. Neither trigger carries any opinion
        # about whether a build is warranted; that decision lives in Python
        # and nowhere else.
        #
        # workflow_dispatch and push are the deliberate escape hatches and
        # bypass the gate entirely: the "Run workflow" button (and the phone
        # Shortcut that hits the same endpoint) must stay a GUARANTEED
        # immediate refresh, which is exactly what makes it the right tool
        # on fight night.
        #
        # Skipping sets an output the later steps check, rather than failing
        # the job -- a red X every few minutes would train everyone to ignore
        # the Actions tab, which is where today's real failures were hiding.
        env:
          # Via env rather than inlined into the script. github.event_name is
          # a trusted fixed enum so this isn't an injection fix, just the
          # form that stays safe if the condition ever widens to a field an
          # outside caller controls (client_payload, a branch name).
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            schedule|repository_dispatch)
              if python scripts/should_refresh.py; then
                echo "build=yes" >> $GITHUB_OUTPUT
              else
                echo "build=no" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "reason=manual or push -- always builds" >> $GITHUB_OUTPUT
              echo "build=yes" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Install dependencies
        # Gated: a skipped run never installs anything. Every step from here
        # down is build-only, so a skip now costs a checkout, a Python setup
        # and a few seconds of stdlib date arithmetic.
        if: steps.cadence.outputs.build == 'yes'
        run: pip install -r requirements.txt

      - name: Merge recorded results into fight history
        if: steps.cadence.outputs.build == 'yes' 
        # Runs BEFORE generate_site so the ratings, streak bonus, recency
        # weighting and fun facts all see the fights immediately.
        #
        # This gap was invisible until a fighter's streak read 4 against a
        # real 5: the site had been recording results to fight_results.csv
        # and never carrying them into fight_history.csv, so it watched 52
        # fights and then predicted the next card as though none had
        # happened. Manual scripts get forgotten -- a 41-fight backlog is
        # what forgetting looks like.
        #
        # No network: reads a file the previous run already wrote.
        run: python scripts/merge_results_into_history.py --apply || true

      - name: Grade recorded prop quotes against results
        if: steps.cadence.outputs.build == 'yes'
        # THE ONE OPEN QUESTION, and it needed switching on rather than
        # answering. Moneyline alpha is dead (21 hypotheses, 16 years, nothing
        # survived) and the six-cell method market is genuinely miscalibrated
        # by ~4 points but carries a 21.8% overround, so the edge cannot pay
        # the toll. What is left is whether a TWO-WAY goes-the-distance or
        # round-totals quote is loose enough to be worth taking.
        #
        # No historical price for that market exists anywhere we can legally
        # and freely reach: the archive is six-cell grids only, Polymarket
        # drops price history the moment a market settles (the CLOB endpoint
        # 400s on a resolved token; every price field collapses to the
        # settlement value), and Kalshi has no settled trades at all. So the
        # test set cannot be bought or backfilled -- it has to be accumulated
        # forward, one card at a time.
        #
        # src/prop_ledger has been recording those quotes since it landed --
        # 326 of them. NOTHING was ever grading them, because this script ran
        # in no workflow. It was a stopwatch nobody had started. Runs AFTER
        # the results merge, so the fights it needs are already on disk.
        #
        # No network. Reports a thin sample and says so until a few hundred
        # settle, which is the honest state for roughly the next year.
        run: python3 scripts/grade_prop_prices.py || true

      - name: Backfill history gaps from ESPN
        # 2, down from 4. Not because 4 was too long for this script, but
        # because the job cap has to cover this step plus the other one plus
        # `Generate site`, and `Generate site` is the only one of the three
        # whose failure produces no site. A backfill is additive and runs ~48
        # times a day: a slice that gets cut short simply resumes on the next
        # build and converges. See the job-level timeout comment.
        timeout-minutes: 2
        # `|| true` IS NOT ENOUGH ON A STEP THAT HAS A TIMEOUT. It catches a
        # non-zero exit from the script; it cannot catch the runner KILLING
        # the step at timeout-minutes, which fails the step and therefore the
        # job. So a step documented as non-blocking was blocking after all,
        # the moment it got slow enough to hit the limit.
        #
        # That is what happened on 2026-08-16: card discovery took
        # future_cards.csv from 6 events / 65 fights to 9 / 75+ within an
        # hour, both ESPN backfills grew proportionally, and every build from
        # 03:22 onward failed. The site sat nine hours stale with two results
        # missing, while the fetcher that would have found them was fine --
        # it just never got to run, because an optional step upstream was
        # killed on time.
        continue-on-error: true
        if: steps.cadence.outputs.build == 'yes'
        # Catches fights that happened between the raw dataset's cutoff and
        # the site's own tracking window -- the range neither other source
        # covers.
        #
        # NON-BLOCKING deliberately. ESPN returns 403 after a burst of calls,
        # and a throttled backfill must not stop the site publishing odds and
        # results. It retries with backoff and reports the block clearly.
        run: python scripts/backfill_history_from_espn.py --apply || true

      - name: Backfill per-fight ESPN stats for carded fighters
        # 2, down from 4, for the reason given on the step above and in the
        # job-level timeout comment: the two backfills and `Generate site`
        # share one job cap, and --missing-only (below) makes a truncated run
        # cost nothing but time-to-converge.
        timeout-minutes: 2
        # Same reasoning as the step above: this is optional data enrichment,
        # so it must never be able to stop the site publishing odds and
        # results. It has no cache in CI (data/.espn_cache is gitignored, and
        # the checkout is shallow anyway), so its cost scales directly with
        # how many carded fighters still lack stats -- which grows every time
        # a new future card is discovered.
        continue-on-error: true
        if: steps.cadence.outputs.build == 'yes'
        # WHY THIS IS HERE NOW. This script is the sole writer of
        # espn_fights, knockdowns_per_fight, sig_strikes_att/absorbed_per_fight
        # and every strikes_*/absorbed_*_share column -- which between them
        # gate three of the radar's six axes AND the entire striking
        # mannequin. It was never in CI, so it only ever ran when someone
        # remembered to run it by hand, with --card-only, against the CURRENT
        # card. The future cards were therefore never fetched at all: 55 of
        # 109 upcoming fighters had no stats, so their radars drew three
        # blank axes and their body maps didn't render. Not missing data --
        # data nobody had asked ESPN for.
        #
        # --cards covers both card files; --missing-only makes the run
        # ADDITIVE. That second flag is a safety property, not an
        # optimisation: the script writes None deliberately so a stat can be
        # cleared, so a broad re-run during an ESPN wobble could blank
        # fighters who currently have good data. Restricting to fighters with
        # no espn_fights means it can only ever fill gaps.
        #
        # Cheap in steady state -- once a card's fighters are backfilled the
        # target list is empty and no requests are made at all. It does real
        # work only when a new card appears.
        #
        # NON-BLOCKING like the history backfill above, and for the same
        # reason: ESPN 403s under bursts, and a throttled stats fetch must
        # not stop the site publishing odds and results.
        run: python scripts/backfill_espn_fight_stats.py --cards --missing-only --apply || true

      - name: Generate site
        # 10, up from 6. This one genuinely MUST fail the job if it breaks --
        # there is no site without it -- so it keeps a hard limit rather than
        # continue-on-error. But the limit was set when the pipeline tracked
        # three future cards and it now tracks nine, each adding Polymarket
        # chart fetches. Measured at 1m23s locally with warm caches; the
        # headroom is for a cold CI runner on a card-discovery week, not for
        # a hang. 12 minutes remains the job-level backstop above it.
        timeout-minutes: 10
        if: steps.cadence.outputs.build == 'yes'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # DraftKings and FanDuel prices via TheRundown. OPTIONAL: without
          # this secret src/live_props skips the source entirely and the site
          # runs on Polymarket exactly as before, so adding the secret is the
          # only step needed to turn it on and removing it is the way to turn
          # it off. The source is metered (20,000 points/day) and keeps its
          # own 15-minute clock regardless of this workflow's cadence -- see
          # the quota arithmetic in src/rundown_source.
          RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
          # Both optional -- unset until the Cloudflare Worker relay
          # (cloudflare-worker/combat-edge-relay.js) is deployed and these
          # two repo secrets are added. Until then, Combat Edge requests
          # behave exactly as before (direct, unrelayed).
          COMBAT_EDGE_RELAY_URL: ${{ secrets.COMBAT_EDGE_RELAY_URL }}
          COMBAT_EDGE_RELAY_TOKEN: ${{ secrets.COMBAT_EDGE_RELAY_TOKEN }}
        run: python generate_site.py

      - name: Lint rendered output
        id: lint
        if: steps.cadence.outputs.build == 'yes'
        # WHAT THIS ACTUALLY SITS IN FRONT OF is the artifact upload below,
        # and therefore the DEPLOY. The old comment here said it gated the
        # commit -- true when docs/index.html was committed, false since
        # .gitignore stopped tracking it, and worth correcting because it is
        # the difference between "this protects the repo" and "this protects
        # the page the reader gets".
        #
        # STILL NON-BLOCKING, and still for the original reason: this job
        # carries live fight-night results, and a linter false positive
        # during a card would freeze the site exactly when it matters most.
        #
        # But `|| true` was throwing away the only signal that survives. It
        # made the step GREEN, so three real failures went out in every build
        # for an unknown number of days with nothing anywhere saying so --
        # they were three lines inside a log regenerated ~48 times a day, and
        # nobody reads those. continue-on-error keeps the job alive exactly
        # like `|| true` did while turning the step YELLOW in the Actions tab
        # and in the phone app, which is the part that reaches a person.
        #
        # TO MAKE THIS A REAL GATE, the change belongs in the linter first:
        # it currently exits 1 on any failure, structural or data-dependent,
        # so a hard gate here would let a model number that moved overnight
        # freeze the site on fight night -- the exact outcome the original
        # `|| true` was protecting against. Once scripts/lint_site.py exits
        # non-zero ONLY for the structural checks (unbalanced HTML, a stray
        # brace, an undeferred init -- properties of the render that no odds
        # feed can move), DELETE THE `continue-on-error` LINE ABOVE and this
        # step becomes the gate on the artifact upload below. Not before.
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/lint_site.py 2>&1 | tee lint.txt

      - name: Publish the lint result to the run summary
        # Same pattern as crosscheck.yml, and for the same reason: the run
        # summary is what the Actions tab and the mobile app show, so a
        # failure is visible without opening raw logs.
        #
        # always() because the point is to report on the run where the linter
        # FAILED; without it this step inherits the job's failed state and the
        # summary goes missing precisely when it is needed. The two other
        # clauses put back what always() removes: a skipped build has no page
        # to lint, and a build where `Generate site` died never reached the
        # linter at all, so neither should write an empty section.
        if: always() && steps.cadence.outputs.build == 'yes' && steps.lint.outcome != 'skipped'
        run: |
          {
            echo "## Rendered-page lint"
            echo ""
            if [ ! -f lint.txt ]; then
              echo "The linter did not run to completion -- see the step log."
            elif grep -q '^  FAIL' lint.txt; then
              echo "**$(grep -c '^  FAIL' lint.txt) failure(s) shipped in this build.**"
            else
              echo "Clean."
            fi
            echo ""
            echo '```'
            if [ -f lint.txt ]; then cat lint.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the free payload carries no model output
        # THE ONE CHECK WHOSE FAILURE CANNOT BE FIXED FORWARD. Once a free
        # payload containing next Saturday's picks has been served it is
        # cached, scraped and public; no later deploy takes it back.
        # Everything else in this pipeline can be corrected on the next run.
        # It therefore has no continue-on-error and no `|| true`.
        if: steps.cadence.outputs.build == 'yes'
        run: python scripts/check_free_build.py

      - name: Check no stake change has rewritten the published record
        # THE OTHER CHANGE THAT CANNOT BE FIXED FORWARD. Every figure on the
        # site is priced off STAKE_SCHEDULE, so an undated stake edit silently
        # restates the whole track record -- and would have restated it
        # UPWARDS (+65.77U against the published +63.44U), which is the
        # direction nobody notices and nobody should ever be able to ship.
        # Hard gate for the same reason as the leak check above.
        if: steps.cadence.outputs.build == 'yes'
        run: python scripts/check_stake_schedule.py

      - name: Publish member payload to R2, then swap free in for Pages
        # ONE STEP, NOT TWO, AND THE SWAP IS UNCONDITIONAL.
        #
        # These were separate steps with separate `if:` conditions, which is
        # how a leak gets built by the code meant to prevent one: upload runs,
        # swap does not, and docs/index.html is still the MEMBER build when
        # Pages publishes it. Splitting an invariant across two conditions
        # means the invariant is only as good as the two conditions agreeing.
        #
        # Pages therefore ALWAYS receives the free payload. R2 upload is the
        # conditional part, and its failure mode is safe: the Worker falls
        # back to the origin when the bucket has no object, so members see the
        # free build rather than an error.
        #
        # The guard is in bash, not in `if:`. A step's own `env:` is NOT
        # visible to that step's `if:` -- the condition is evaluated before the
        # step environment exists, so `env.CF_API_TOKEN != ''` was always
        # false and this step silently skipped. Silently: a skipped step and a
        # successful one look identical in a green run.
        if: steps.cadence.outputs.build == 'yes'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -s build/free.html

          if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ]; then
            # docs/index.html is still the MEMBER build at this point.
            curl -sS --fail-with-body -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/octane-alpha-member/objects/index.html" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: text/html" \
              --data-binary @docs/index.html > /dev/null
            echo "R2: uploaded member payload, $(wc -c < docs/index.html) bytes"
          else
            echo "R2: CLOUDFLARE_API_TOKEN/ACCOUNT_ID absent -- skipping upload."
            echo "R2: members will fall back to the free build until this is set."
          fi

          cp build/free.html docs/index.html
          echo "Pages: docs/index.html is the free payload, $(wc -c < docs/index.html) bytes"

          # WHEN THE NEXT CARD IS, published for the Worker.
          #
          # The trial has to end AFTER a fight card, or a subscriber can trial
          # the product without ever seeing it do the thing they pay for. Only
          # the build knows the schedule and the Worker cannot read a CSV, so
          # the date goes into KV where checkout reaches it in one read.
          #
          # Written as a ONE-LINER on purpose: a multi-line python -c here has
          # to be indented to stay inside this YAML block scalar, and getting
          # that wrong breaks the whole workflow file rather than just this
          # step. It did, once.
          NEXT_EVENT=$(python3 -c "import pandas as pd,datetime; df=pd.read_csv('data/future_cards.csv'); t=datetime.date.today().isoformat(); d=sorted(x for x in df['event_date'].dropna().astype(str).unique() if x>=t); print(d[0] if d else '')" || echo "")
          # NON-FATAL, DELIBERATELY. This is a cache write, not a publish
          # step: without it the Worker falls back to a flat seven-day trial,
          # which is slightly worse timing and nothing more. It sat inside
          # `set -e` and took the whole job down -- including the Pages deploy
          # after it -- the first time the token lacked KV permission. A
          # degradable write must not be able to stop the site shipping.
          if [ -n "${CF_API_TOKEN:-}" ] && [ -n "$NEXT_EVENT" ]; then
            if curl -sS --fail -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/08be74c429d04c03ad803f79ee2076aa/values/next_event_date" \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -F "value=$NEXT_EVENT" -F 'metadata={}' > /dev/null 2>&1; then
              echo "KV: next_event_date = $NEXT_EVENT"
            else
              echo "KV: write failed (token likely lacks Workers KV Storage:Edit)."
              echo "KV: not fatal -- trials fall back to a flat 7 days until fixed."
            fi
          fi

      - name: Upload the built site
        if: steps.cadence.outputs.build == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Commit and push if changed
        if: steps.cadence.outputs.build == 'yes'
        # NON-BLOCKING, because this step runs AFTER the artifact is already
        # uploaded and it is the last thing in the job. Without this, a
        # rejected push -- a rebase the ours-driver cannot resolve, a
        # transient GitHub API error, the remote moving underneath a
        # queue-slipped run, all of which the comments below describe as
        # things that really happen here -- failed the refresh job, and the
        # `deploy` job's `needs: refresh` then evaluated its implicit
        # success() as false and SKIPPED. A good page, linted and sitting in
        # a valid uploaded artifact, went unpublished because the bookkeeping
        # commit behind it failed.
        #
        # What is committed here is state for the NEXT run (results, the odds
        # snapshot, the token cache, the predictions log), not a precondition
        # for publishing this one. Losing it costs one cycle of state that
        # the next build regenerates; losing the deploy costs the reader the
        # page. So the failure is marked non-fatal and stays YELLOW in the
        # Actions tab rather than red -- visible, but not load-bearing.
        #
        # Deliberately NOT paired with a change to the deploy job's `if`.
        # Relaxing that condition to always() would publish on runs where
        # `Generate site` itself failed and no artifact was ever uploaded,
        # which is a red deploy job for a build that correctly produced
        # nothing. One fix, at the end that is actually optional.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .gitattributes points docs/* and data/* at a custom "ours"
          # merge driver, but git doesn't ship one under that name --
          # it has to be registered locally before git will honor it.
          # Each Actions run gets a fresh, empty checkout with no config
          # carried over from previous runs, so without this line every
          # run silently falls back to a real content-level merge on
          # these files and fails with a genuine conflict the moment
          # the remote has moved (a manual push, or a prior queued run).
          git config merge.ours.driver true
          # Directory-scoped, not an explicit file list -- an explicit
          # list silently misses any new output file a future change
          # adds (this is exactly what broke: data/future_cards.csv and
          # data/fighters.csv were both being written by the pipeline
          # but weren't in the old list, which left them uncommitted and
          # made every subsequent `git pull --rebase` below fail against
          # a dirty working tree, halting the job before it ever reached
          # `git push`). Scoped to docs/ and data/ specifically rather
          # than `git add -A` at the repo root, so it can never
          # accidentally stage something outside the pipeline's own
          # output (source changes, workflow edits, etc.).
          # data/ ONLY. docs/ is the BUILT SITE and is no longer committed:
          # Pages deploys it from the uploaded artifact, so committing it
          # bought nothing but ~100MB of repo growth a month (a 4MB
          # index.html rewritten on every run, which barely compresses
          # against the previous version) and a merge conflict on every
          # pull. The pack had reached 157MB and the Pages builder was
          # timing out cloning it.
          #
          # data/ still IS committed -- it's genuine state the next run
          # needs: recorded results, the odds snapshot, the token cache,
          # the predictions log.
          # data/ plus docs/ -- .gitignore decides what within docs/ is
          # eligible, so the per-build index.html and movements/ are excluded
          # while the brand assets (which change perhaps twice a year) are
          # kept. Staging docs/ wholesale here would have been wrong before
          # that ignore existed; with it, this is the safe form.
          git add -A -- data/ docs/
          git diff --staged --quiet || git commit -m "Auto-refresh site [skip ci]"
          # Rebase onto whatever landed on the remote while this run was
          # working (a manual push, or a run that slipped past the
          # concurrency queue) instead of failing on a non-fast-forward.
          git pull --rebase origin main
          git push

  deploy:
    needs: refresh
    if: needs.refresh.outputs.build == 'yes' 
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Falls back to the retry's URL: on a first-attempt failure the original
      # output is empty and the environment link would render blank.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # RETRIED ONCE, because the failures here are transient and server-side.
      #
      # THE PREVIOUS DIAGNOSIS IN THIS BLOCK WAS WRONG and is corrected below,
      # because it sent the next reader (and it did) after the wrong thing.
      # It read: "Every failure so far has been the ACTION giving up while
      # GitHub still reported deployment_in_progress -- not an error from
      # Pages", and on that basis raised the timeout to 30 minutes.
      #
      # Run 2574 refutes it. GitHub itself marked the DEPLOYMENT failed:
      #     15:06:09  in_progress
      #     15:07:05  failure
      # Fifty-six seconds, against a 30-minute timeout. The action did not
      # give up; Pages failed it. No timeout value addresses that, and the
      # generous timeout below is retained only because it is harmless.
      #
      # What the evidence supports is a retry. The same sha deployed cleanly
      # six minutes later in 13 seconds, so the artifact and the config were
      # both fine -- permissions, upload-pages-artifact@v3 and path: docs all
      # verified on the failing run.
      #
      # WHY NOT "SKIP THE DEPLOY WHEN THE PAGE IS UNCHANGED", which is the
      # obvious way to reduce exposure: the page is never unchanged. docs/ is
      # gitignored and never committed, so there is nothing to diff against,
      # and two builds four minutes apart differ by 344 lines -- the build
      # stamp, live prices, and which props clear the standout threshold.
      # Excluding the volatile fields to force the comparison would risk the
      # far worse failure of NOT publishing a page that really did change.
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 20

      - name: Retry the deploy once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 20
