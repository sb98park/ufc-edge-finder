# Octane Alpha edge gate.
#
# WHY THIS FILE EXISTS AT ALL. The three Workers in this directory were
# deployed by pasting them into the Cloudflare dashboard. That left no record
# of which version was actually running, and no way to tell whether the file
# in git matched production. For a Worker that merely proxied a password
# prompt that was survivable. For one that decides who can read paid content,
# it is not: "is the deployed gate the same as the reviewed gate?" has to be
# answerable, and `wrangler deploy` from a committed config is the answer.
#
# Deploy:      npx wrangler deploy --config cloudflare-worker/wrangler.toml
# Secrets:     npx wrangler secret put NAME --config cloudflare-worker/wrangler.toml
# Tail logs:   npx wrangler tail octane-gate --config cloudflare-worker/wrangler.toml

name = "octane-gate"
main = "octane-gate.js"
compatibility_date = "2026-08-01"
workers_dev = false

# THE ROUTE MUST BE DECLARED HERE, not left to the dashboard. A `wrangler
# deploy` from a config that omits routes can drop the existing binding, and
# for a Worker sitting in front of the whole site that does not fail safely --
# it takes the site down. Read from the API rather than assumed:
# GET /zones/{zone}/workers/routes returned exactly this one pattern bound to
# this script, and no www variant.
[[routes]]
pattern = "octanealpha.com/*"
zone_name = "octanealpha.com"

# The member payload. PRIVATE BY DEFAULT and reachable only through this
# binding -- that is the entire reason paid content lives in R2 rather than
# beside the free build on GitHub Pages, where it would be one URL guess away
# from being free.
[[r2_buckets]]
binding = "MEMBER_PAYLOAD"
bucket_name = "octane-alpha-member"

# Entitlement cache. Supabase remains the source of truth; this is a mirror
# written by the Stripe webhook so a page request never waits on a database
# round trip. Rebuildable at any time -- losing it costs a slow first request,
# not correctness.
[[kv_namespaces]]
binding = "OCTANE_ENTITLEMENTS"
id = "08be74c429d04c03ad803f79ee2076aa"

[vars]
SUPABASE_URL = "https://kmifrsmgypghjwmzoffd.supabase.co"
# Public by design: it carries no privileges of its own, only what the row
# level security policies in supabase/migrations grant it.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttaWZyc21neXBnaGp3bXpvZmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MzU3OTEsImV4cCI6MjEwMzAxMTc5MX0.iKjw9pcpFQPfCd8H0_pt3EUJl3svd29aPMH2CWlGBco"
# LIVE prices, in the parent account. The sandbox ones we tested against
# (…DSgC9GOVMw…) belonged to a separate account entirely and are gone from
# here deliberately: leaving them as a fallback would mean a
# misconfiguration silently charged nobody instead of failing loudly.
STRIPE_PRICE_MONTHLY = "price_1U7dZ7DlM6LyKh592dHyXuoe"
STRIPE_PRICE_ANNUAL  = "price_1U7daUDlM6LyKh59FUiiXvtg"

# PUBLIC. The shared-password wall is off; the site serves the free build to
# anyone and the R2 member payload to accounts with an entitlement.
#
# Flipped only after the whole chain was exercised against live
# infrastructure: Supabase sign-in, JWKS verification, the lifetime grant,
# R2 delivery, a real Stripe subscription created and cancelled, and the live
# webhook signature verified in both directions.
#
# Rollback is this value back to "password" and a redeploy -- the wall's code
# is still here and still works.
GATE_MODE = "auth"

# SEARCH VISIBILITY. Anything other than "on" makes the Worker answer every
# request with X-Robots-Tag: noindex, nofollow.
#
# Not robots.txt Disallow: blocking the crawl stops a robot READING the page,
# so it never sees the noindex -- and a URL found some other way can still be
# listed, with nothing to suppress it. Allowing the crawl and answering
# "noindex" is what actually keeps a page out of search.
#
# Flip to "on" when the site is ready for visitors. Expect days to weeks
# before anything appears in results; deindexing later is far slower than
# never being indexed.
INDEXING = "off"

# SECRETS ARE NOT DECLARED HERE. They are set with `wrangler secret put` and
# live only in Cloudflare. Anything in [vars] is committed to git in plain
# text, which is correct for the two values above and would be a disclosure
# for these:
#
#   SUPABASE_JWT_SECRET        verifies Supabase tokens at the edge
#   SUPABASE_SERVICE_ROLE_KEY  reads entitlement, bypasses RLS
#   SESSION_SECRET             signs this Worker's own session cookie
#   STRIPE_SECRET_KEY          creates Checkout sessions
#   STRIPE_WEBHOOK_SECRET      verifies webhook signatures
